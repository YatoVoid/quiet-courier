# HTTP/2 stays off: on nginx 1.18 it is set per listening socket, so turning it on here
# would turn it on for every other site sharing port 443.
server {
    listen 80;
    listen [::]:80;
    server_name quietcourier.com www.quietcourier.com;
    return 301 https://quietcourier.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.quietcourier.com;
    ssl_certificate /etc/letsencrypt/live/quietcourier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quietcourier.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://quietcourier.com$request_uri;
}

# The app sends its own CSP, frame and referrer headers, so only HSTS is added here.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quietcourier.com;
    ssl_certificate /etc/letsencrypt/live/quietcourier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quietcourier.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;
    autoindex off;

    limit_req zone=courier_site burst=40 nodelay;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
