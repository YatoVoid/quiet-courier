server {
    listen 80;
    listen [::]:80;
    server_name quietcourier.com www.quietcourier.com;
    return 301 https://quietcourier.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.quietcourier.com;
    ssl_certificate /etc/letsencrypt/live/quietcourier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quietcourier.com/privkey.pem;
    include snippets/security-headers.conf;
    return 301 https://quietcourier.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quietcourier.com;
    ssl_certificate /etc/letsencrypt/live/quietcourier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quietcourier.com/privkey.pem;
    include snippets/security-headers.conf;

    client_max_body_size 64k;
    autoindex off;

    limit_req zone=courier_site burst=40 nodelay;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
