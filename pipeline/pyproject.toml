[project]
name = "broadsheet"
version = "0.1.0"
description = "Builds a daily vintage-style newspaper for e-ink readers from public-domain and openly licensed sources."
requires-python = ">=3.11"
dependencies = [
    "weasyprint>=66",
    "jinja2>=3.1",
    "astral>=3.2",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
broadsheet = "broadsheet.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["broadsheet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
