name: Archive index

# loc.gov blocks the production server, so the index of 1920s issues is built here and
# committed. The server downloads it weekly (`courier maintain`).
on:
  schedule:
    - cron: "17 3 2 * *"
  workflow_dispatch:
    inputs:
      from:
        description: First edition date (leave empty to extend automatically)
        required: false
      to:
        description: Last edition date
        required: false

permissions:
  contents: write

concurrency:
  group: archive-index

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -e pipeline
      - name: Fetch the issue lists
        working-directory: pipeline
        env:
          COURIER_CONTACT_EMAIL: hello@quietcourier.com
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          if [ -n "$FROM" ] && [ -n "$TO" ]; then
            python -m courier archive-index --from "$FROM" --to "$TO"
          else
            python -m courier archive-index --auto
          fi
      - name: Commit the extended index
        run: |
          git diff --quiet -- pipeline/courier/data/archive-index.json.gz && { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/courier/data/archive-index.json.gz
          git commit -m "Extend the archive index"
          git push
